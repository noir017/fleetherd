<!doctype html>
<!-- Static wireframe of the web UI workbench (docs/webui-workbench-plan.md). Design v3 + status bar (2026-11-24);
     editor tabs, the remaining pages and the phone shell (2026-11-25). VS Code Dark Modern / Light Modern colours
     and control styles. Not product code.
     One set of components (sidebar views, editors, topic tools, sheets) rendered by two shells:
     - desktop workbench, by hash: #topic (default) #files #term #palette #menu #confirm #new #tasks #task-edit
       #sessions #history #reviews #prefs #skills #settings #settings-gw #instr #device #login
     - 640–1023px (or ?t): the same workbench with the sidebar and the tool pane as drawers (?drawer=list|pane)
     - phone stack shell, below 640px or with ?m, by hash: #topics #topic #sheet-model #sheet-row #confirm #new
       #topic-changes #topic-diff #topic-files #topic-file #topic-term #tasks #task #task-edit #sessions #history
       #history-rec #more #appearance #reviews #review #prefs #skills #skill #settings #settings-agents
       #settings-delegation #settings-session #settings-reply #settings-review #settings-instr #login
     ?gallery lays every phone page out side by side (?gallery=N for one group, ?gallery=t for the 820px drawers).
     ?light for the light theme. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fleetherd — workbench mockup</title>
<style>
:root{--bg:#1f1f1f;--panel:#181818;--rail:#181818;--line:#2b2b2b;--fg:#cccccc;--fg-hi:#e7e7e7;--dim:#9d9d9d;--soft:#868686;
  --accent:#0078d4;--accent-hov:#026ec1;--link:#4daafc;--focus:#0078d4;
  --field:#313131;--field-line:#3c3c3c;--ph:#989898;--btn2:#313131;--btn2-hov:#3c3c3c;--hover:#2a2d2e;--act-hov:rgba(90,93,94,.31);
  --sel:#04395e;--sel-in:#37373d;--toggle:rgba(36,137,219,.51);--toggle-line:#2488db;--widget:#252526;--code:#2b2b2b;--card:#181818;
  --own:rgba(0,120,212,.10);--own-edge:#0078d4;--own-m:rgba(0,120,212,.26);
  --ok:#89d185;--ok-bg:rgba(137,209,133,.14);--warn:#cca700;--err:#f14c4c;--idle:#6e7681;
  --g-mod:#e2c08d;--g-add:#81b88b;--g-new:#73c991;--g-del:#e06c6c;--add:rgba(155,185,85,.2);--del:rgba(255,0,0,.2);--ln:#6e7681;--hunk:#4daafc;
  --hc1:#e0805f;--hc1-bg:rgba(224,128,95,.15);--hc2:#3fb68b;--hc2-bg:rgba(63,182,139,.15);--scroll:rgba(121,121,121,.4)}
html[data-theme=light]{--bg:#ffffff;--panel:#f8f8f8;--rail:#f8f8f8;--line:#e5e5e5;--fg:#3b3b3b;--fg-hi:#1f1f1f;--dim:#717171;--soft:#616161;
  --accent:#005fb8;--accent-hov:#0258a8;--link:#005fb8;--focus:#005fb8;
  --field:#ffffff;--field-line:#cecece;--ph:#767676;--btn2:#e5e5e5;--btn2-hov:#cccccc;--hover:#f2f2f2;--act-hov:rgba(184,184,184,.31);
  --sel:#e8e8e8;--sel-in:#e4e6f1;--toggle:rgba(0,95,184,.12);--toggle-line:#005fb8;--widget:#f8f8f8;--code:#f2f2f2;--card:#ffffff;
  --own:rgba(0,95,184,.06);--own-edge:#005fb8;--own-m:rgba(0,95,184,.11);
  --ok:#388a34;--ok-bg:rgba(56,138,52,.10);--warn:#bf8803;--err:#e51400;--idle:#8b949e;
  --g-mod:#895503;--g-add:#587c0c;--g-new:#007100;--g-del:#ad0707;--add:rgba(155,185,85,.2);--del:rgba(255,0,0,.12);--ln:#8b949e;--hunk:#005fb8;
  --hc1:#b5532f;--hc1-bg:rgba(181,83,47,.10);--hc2:#0d8a6a;--hc2-bg:rgba(13,138,106,.10);--scroll:rgba(100,100,100,.4)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe WPC","Segoe UI",system-ui,"Noto Sans CJK SC",sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll)}::-webkit-scrollbar-track{background:transparent}
code{font:12px "Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;background:var(--code);padding:1px 4px;border-radius:3px}

/* ================= desktop workbench ================= */
.shell{display:grid;grid-template-columns:52px 264px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) 22px;height:100%}
.rail,.list,.main,.pane{grid-row:1;min-height:0}
.sb{grid-column:1/-1;grid-row:2;display:flex;align-items:stretch;background:var(--rail);border-top:1px solid var(--line);font-size:12px;color:var(--fg)}
.sb .it{display:flex;align-items:center;gap:4px;padding:0 8px;cursor:pointer}.sb .it:hover{background:var(--act-hov)}
.sb .it svg.i{width:14px;height:14px}.sb .rm{background:var(--accent);color:#fff;padding:0 10px}.sb .sp{flex:1}.sb .okc{color:var(--ok);display:flex}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rail .logo{width:30px;height:30px;border-radius:4px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:8px}
.ri{position:relative;width:44px;height:44px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--soft);font-size:10px}
.ri:hover{color:var(--fg-hi)}.ri.on{color:var(--fg-hi)}
.ri.on::before{content:"";position:absolute;left:-4px;top:6px;bottom:6px;width:2px;background:var(--accent)}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center}
.badge.dot{min-width:8px;width:8px;height:8px;padding:0;top:7px;right:10px;background:var(--warn)}
.rail .sp{flex:1}
/* sidebar group */
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.lh{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
.lh b{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;flex:1;color:var(--fg)}
.ib{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--fg)}.ib:hover{background:var(--act-hov)}
.ib svg.i{width:16px;height:16px}
.seg{display:flex;background:var(--widget);border:1px solid var(--field-line);border-radius:2px;padding:2px;gap:2px;margin:10px 10px 0}
.seg button{flex:1;padding:4px 0;border-radius:2px;color:var(--dim);font-size:12px}.seg button.on{background:var(--sel-in);color:var(--fg-hi)}
.search{margin:8px 10px;display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--field-line);border-radius:2px;padding:5px 8px;color:var(--ph)}
.search svg.i{width:15px;height:15px}
.chips{display:flex;gap:4px;margin:0 10px 6px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:2px;background:transparent;border:1px solid var(--field-line);color:var(--dim)}
.chip.on{border-color:var(--toggle-line);color:var(--fg-hi);background:var(--toggle)}
.rows{flex:1;overflow:auto;padding:2px 0 8px}
.grp{font-size:11px;font-weight:600;color:var(--dim);padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.05em}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:7px 14px;border:1px solid transparent}
.row:hover,.row.hv{background:var(--hover)}.row.on{background:var(--sel);border-color:var(--focus);color:var(--fg-hi)}
.row .d{width:8px;height:8px;border-radius:50%;background:var(--idle)}.d.run{background:var(--ok)}.d.ask{background:var(--warn)}.d.bad{background:var(--err)}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m{grid-column:2;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:11px;color:var(--dim)}
.row.sub{padding-left:32px}
.row.nd{grid-template-columns:minmax(0,1fr) auto}.row.nd .m{grid-column:1}.row.off{opacity:.55}
.row .t svg.i{width:13px;height:13px;margin-right:4px;vertical-align:-2px;color:var(--dim)}
.hc{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:2px;background:var(--hc1-bg);color:var(--hc1);margin-right:4px}.hc.cx{background:var(--hc2-bg);color:var(--hc2)}
.lm{display:block;width:calc(100% - 20px);margin:8px 10px 0;padding:5px 0;border:1px solid var(--field-line);border-radius:2px;color:var(--fg);font-size:12px}.lm:hover{background:var(--hover)}
.nav{padding:6px 0}.nv{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--fg);border:1px solid transparent}.nv:hover{background:var(--hover)}.nv.on{background:var(--sel);border-color:var(--focus);color:var(--fg-hi)}.nv .c{margin-left:auto;font-size:10.5px;min-width:16px;padding:0 5px;border-radius:8px;background:var(--btn2-hov);color:var(--fg);text-align:center}
.nv svg.i{width:15px;height:15px;color:var(--warn)}
.nvh{font-size:11px;font-weight:600;color:var(--dim);padding:12px 14px 4px;text-transform:uppercase;letter-spacing:.05em}
/* editor group: tabs + editor */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.tabs{flex:none;display:flex;height:35px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;max-width:240px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--soft);font-size:12.5px;white-space:nowrap;cursor:pointer}
.tab span{overflow:hidden;text-overflow:ellipsis}.tab>svg.i{width:15px;height:15px}
.tab:hover{color:var(--fg)}.tab.on{background:var(--bg);color:var(--fg-hi);box-shadow:inset 0 1px 0 var(--accent)}
.tab .mk{width:7px;height:7px;border-radius:50%;flex:none}.mk.run{background:var(--ok)}.mk.dirty{background:var(--fg-hi)}
.tab .x{width:20px;height:20px;border-radius:3px;display:grid;place-items:center;opacity:0}.tab .x svg.i{width:13px;height:13px}
.tab.on .x,.tab:hover .x{opacity:1}.tab .x:hover{background:var(--act-hov)}
.th{flex:none;display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 18px;border-bottom:1px solid var(--line)}
.th .tt{font-weight:600;font-size:14px;color:var(--fg-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{font-size:11px;padding:1px 7px;border-radius:3px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.pill.n{background:var(--btn2);color:var(--fg)}.pill.e{background:rgba(241,76,76,.14);color:var(--err)}
.th .sp{flex:1}
.tools{display:flex;gap:2px;background:var(--widget);border:1px solid var(--field-line);border-radius:2px;padding:2px}
.tools button{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:2px;color:var(--dim);font-size:12px;white-space:nowrap}
.tools button svg.i{width:15px;height:15px}.tools button:hover{color:var(--fg-hi)}.tools button.on{background:var(--sel-in);color:var(--fg-hi)}
.tools .k{font-size:10px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;line-height:15px;text-align:center}
.only-narrow{display:none!important}body.narrow .only-narrow{display:flex!important}
.log{flex:1;overflow:auto;padding:22px 0}
.col{max-width:760px;margin:0 auto;padding:0 24px}
.msg{margin:0 0 16px}.msg.me{background:var(--own);border-left:2px solid var(--own-edge);border-radius:0 4px 4px 0;padding:10px 14px;color:var(--fg-hi)}
.msg .ts{font-size:11px;color:var(--dim);margin-top:4px}
.meta{color:var(--dim);font-size:12px;margin:0 0 16px}
.tool{border:1px solid var(--line);border-radius:4px;padding:5px 10px;color:var(--dim);font-size:12px;margin:6px 0;display:flex;gap:8px;align-items:center;background:var(--panel)}
.tool svg.i{width:15px;height:15px}
.chg{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:12px;display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--panel)}
.chg svg.i{width:15px;height:15px}.chg span:last-child{color:var(--link)!important}
.add{color:var(--g-add)}.del{color:var(--g-del)}
.bar{flex:none;border-top:1px solid var(--line);padding:8px 0 14px}
.status{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:8px}
.status a{color:var(--link);text-decoration:none}.status svg.i{width:15px;height:15px}
.cmt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.cmt span{font-size:11.5px;background:var(--toggle);border:1px solid var(--toggle-line);color:var(--fg-hi);border-radius:2px;padding:1px 7px}
.comp{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--field-line);border-radius:4px;padding:7px 7px 7px 12px;background:var(--field);color:var(--dim)}
.comp .in{flex:1;color:var(--ph);padding:4px 0;min-height:22px}
.send{background:var(--accent);color:#fff;border-radius:2px;padding:5px 14px}.send:hover{background:var(--accent-hov)}
.ro{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 12px;background:var(--panel);color:var(--dim);font-size:12.5px}
.ro svg.i{width:16px;height:16px}.ro span{flex:1}
/* topic tool pane */
.pane{width:520px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);position:relative}
.pane .grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize}
.ph{display:flex;align-items:center;gap:8px;height:48px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.ph b{font-size:13px;color:var(--fg-hi)}.ph .br{font:11.5px "Cascadia Code",Consolas,monospace;color:var(--dim)}
.modes{display:flex;gap:2px;margin:8px 12px 0;font-size:12px}.modes button{padding:3px 10px;border-radius:2px;color:var(--dim)}.modes button:hover{color:var(--fg-hi)}.modes button.on{background:var(--sel-in);color:var(--fg-hi)}
.files{border-bottom:1px solid var(--line);padding:6px 0}
.fr{display:flex;gap:8px;align-items:center;padding:4px 14px;font:12px "Cascadia Code",Consolas,monospace;border:1px solid transparent}.fr.on{background:var(--sel);border-color:var(--focus);color:var(--fg-hi)}
.fr .s{color:var(--g-mod);font-weight:700}.fr .s.a{color:var(--g-new)}.fr .x{margin-left:auto;font-size:11px}.fr .x i{font-style:normal;color:var(--g-add)}.fr .x u{text-decoration:none;color:var(--g-del);margin-left:4px}
.files.box{border:1px solid var(--line);border-radius:4px 4px 0 0;border-bottom:0;background:var(--card)}
.files .fr svg.i{width:14px;height:14px;color:var(--dim)}.fr.new{color:var(--link);font-family:inherit}
.diff{flex:1;overflow:auto;font:12px/1.6 "Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;padding:6px 0}
.dl{display:grid;grid-template-columns:36px 1fr;padding:0 10px 0 0;white-space:pre}.dl .no{color:var(--ln);text-align:right;padding-right:10px}
.dl.h{color:var(--hunk);background:var(--widget)}.dl.p{background:var(--add)}.dl.m{background:var(--del)}.dl.sel{box-shadow:inset 2px 0 0 var(--accent)}.dl.mod{box-shadow:inset 2px 0 0 var(--g-mod)}
.cbox{margin:6px 12px 12px;border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:0 0 4px 4px;padding:8px;background:var(--widget)}
.cbox .q{font-size:11.5px;color:var(--dim);margin-bottom:6px}.cbox .ta{background:var(--field);border:1px solid var(--focus);border-radius:2px;padding:6px 8px;min-height:44px;color:var(--fg-hi)}
.cbox .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.btn{border:0;border-radius:2px;padding:4px 12px;background:var(--btn2);color:var(--fg);white-space:nowrap}.btn:hover{background:var(--btn2-hov)}.btn.p{background:var(--accent);color:#fff}.btn.p:hover{background:var(--accent-hov)}
/* page editors (settings / task / review / skill) */
.page{flex:1;overflow:auto}.pcol{max-width:820px;margin:0 auto;padding:22px 28px}
.psub{color:var(--dim);font-size:12px;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden;background:var(--card)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.ci:last-child{border-bottom:0}.ci:hover{background:var(--hover)}
.ci .l{font-weight:500;color:var(--fg-hi)}.ci .h{grid-column:1;color:var(--dim);font-size:12px}
.ci>.btn,.ci>.acts,.ci>.pill{grid-row:span 2}.acts{display:flex;gap:6px}
.sg{display:flex;background:var(--field);border:1px solid var(--field-line);border-radius:2px;padding:2px;gap:2px;grid-row:span 2}.sg span{padding:2px 10px;border-radius:2px;font-size:12px;color:var(--dim)}.sg span.on{background:var(--accent);color:#fff}
.sh{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:20px 2px 8px}
.dv{font:12px/1.6 "Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 0}
.ed{border:1px solid var(--line);border-radius:0 0 4px 4px;overflow:hidden;margin-bottom:14px}
.edh{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px}
.edh b{color:var(--fg-hi);font-weight:600}.edh .dim{color:var(--dim)}.edh .sp{flex:1}
.edb{font:12px/1.6 "Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;background:var(--bg);padding:6px 0}
.ags{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ag{border:1px solid var(--line);border-radius:4px;padding:9px 12px;background:var(--card);cursor:pointer}.ag:hover{background:var(--hover)}
.ag.on{background:var(--sel);border-color:var(--focus)}.ag.off{opacity:.5;cursor:default}
.ag b{color:var(--fg-hi);font-weight:600}.ag .k{color:var(--dim);font-size:12px;margin-top:2px}
.ag .tag{float:right;font-size:10.5px;padding:0 6px;border:1px solid var(--field-line);border-radius:2px;color:var(--dim)}
.dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.dir{padding:4px 10px;border:1px solid transparent;border-radius:2px;background:var(--btn2);font:12px "Cascadia Code",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dir:hover{background:var(--btn2-hov)}
.dir.on{background:var(--accent);color:#fff}.dir.more{background:none;border:1px dashed var(--field-line);color:var(--dim);font-family:inherit}

/* forms, dropdowns */
.dd{display:inline-flex;align-items:center;justify-content:flex-start;gap:8px;min-width:180px;padding:3px 6px 3px 8px;border:1px solid var(--field-line);border-radius:2px;background:var(--field);color:var(--fg);font-size:12px;grid-row:span 2;white-space:nowrap}
.dd svg.i{width:14px;height:14px;margin-left:auto;color:var(--dim)}
.fld{margin-bottom:16px}.fld>label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--fg-hi)}.fld .hint{margin-top:5px;font-size:11.5px;color:var(--dim)}
.inp{display:flex;align-items:center;min-height:28px;padding:4px 8px;border:1px solid var(--field-line);border-radius:2px;background:var(--field);color:var(--fg-hi);font-size:13px}
.inp.ta{min-height:76px;align-items:flex-start;font:12px/1.6 "Cascadia Code","JetBrains Mono",Consolas,monospace}.inp.pl{color:var(--ph)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.sg.inl{display:inline-flex}
.tagx{display:inline-flex;align-items:center;gap:3px;padding:1px 3px 1px 8px;border-radius:2px;background:var(--btn2);color:var(--fg);font-size:11.5px}.tagx svg.i{width:12px;height:12px}
.fbar{display:flex;justify-content:flex-end;gap:8px}
.btn.dg{background:var(--err);color:#fff}
.files.box.solo{border-radius:4px;border-bottom:1px solid var(--line);margin-bottom:6px}.files .fr .x{color:var(--dim);font-family:inherit}
/* file tree (topic tool) */
.tree{flex:none;max-height:40%;overflow:auto;padding:4px 0;border-bottom:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:5px;height:22px;padding-right:12px;border:1px solid transparent;font-size:12.5px;white-space:nowrap}
.tr:hover{background:var(--hover)}.tr.on{background:var(--sel);border-color:var(--focus);color:var(--fg-hi)}
.tr svg.i{width:15px;height:15px;color:var(--dim)}.tr svg.fd{color:var(--link)}
.tr .tw{width:14px;display:grid;place-items:center}.tr .tw svg.i{width:12px;height:12px}
.tr .gm{margin-left:auto;font:700 11px "Cascadia Code",Consolas,monospace;color:var(--g-mod)}
.banner{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:rgba(204,167,0,.12);font-size:12px;color:var(--fg-hi)}
.banner svg.i{width:15px;height:15px;color:var(--warn)}.banner span{flex:1}
.pane .edh{flex:none}
/* bottom panel (terminal) */
.bp{position:relative;flex:none;height:42%;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--bg)}
.bp .grip{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:row-resize}
.bph{flex:none;display:flex;align-items:center;gap:2px;height:35px;padding-right:6px;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
.bph .tabs{background:none;box-shadow:none}.bph .sp{flex:1}
.bp .term{flex:1;min-height:0;overflow:auto}
/* overlays */
.ov{position:fixed;inset:0;z-index:20}.ov.dim{background:rgba(0,0,0,.36)}
kbd{display:inline-block;min-width:18px;padding:0 4px;border:1px solid var(--field-line);border-bottom-width:2px;border-radius:3px;background:var(--bg);color:var(--dim);font:11px/15px "Cascadia Code",Consolas,monospace;text-align:center}
.qp{position:absolute;top:52px;left:50%;width:620px;margin-left:-310px;overflow:hidden;background:var(--widget);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.36)}
.qp .qi{display:flex;align-items:center;gap:6px;margin:8px;padding:5px 8px;border:1px solid var(--focus);border-radius:2px;background:var(--field);color:var(--fg-hi)}.qp .qi svg.i{width:15px;height:15px;color:var(--dim)}
.qp .qg{padding:8px 12px 3px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.qp .qr{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:1px solid transparent;color:var(--fg)}.qp .qr svg.i{width:15px;height:15px;color:var(--dim)}
.qp .qr.on{background:var(--sel);border-color:var(--focus);color:var(--fg-hi)}.qp .qr small{font-size:11.5px;color:var(--dim)}.qp .qr .k2{margin-left:auto;font-size:11px;color:var(--dim)}
.qp .qf{display:flex;gap:16px;margin-top:6px;padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.cmenu{position:absolute;min-width:210px;padding:4px 0;background:var(--widget);border:1px solid var(--line);border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.36)}
.cmenu .mx{display:flex;align-items:center;gap:9px;height:26px;margin:0 4px;padding:0 10px;border-radius:3px;font-size:12.5px;color:var(--fg)}.cmenu .mx svg.i{width:15px;height:15px;color:var(--dim)}
.cmenu .mx.on{background:var(--sel);color:var(--fg-hi)}.cmenu .mx.dg,.cmenu .mx.dg svg.i{color:var(--err)}.cmenu .mx kbd{margin-left:auto}
.cmenu .sep{height:1px;margin:4px 0;background:var(--line)}
.dlg{position:absolute;top:28%;left:50%;width:440px;margin-left:-220px;padding:18px 20px 16px;background:var(--widget);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.36)}
.dlg h3{margin:0 0 8px;font-size:14px;color:var(--fg-hi)}.dlg p{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
/* login */
.login{min-height:100%;display:grid;place-items:center;background:var(--panel)}
.lg{width:340px;padding:28px 28px 24px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lgo{width:40px;height:40px;margin-bottom:14px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.lg h1{margin:0 0 4px;font-size:18px;color:var(--fg-hi)}.lg p{margin:0 0 16px;font-size:12.5px;color:var(--dim)}
.lg .inp{margin-bottom:6px;border-color:var(--err);letter-spacing:.2em}.lg .er{margin-bottom:14px;font-size:12px;color:var(--err)}
.lg .btn{width:100%;padding:7px 0}.lg .ln{margin-top:14px;font-size:11.5px;color:var(--dim)}
/* 640–1023px: sidebar and tool pane as drawers */
body.tablet .shell{position:relative;grid-template-columns:52px minmax(0,1fr)}
body.tablet .list{position:absolute;top:0;bottom:22px;left:52px;z-index:8;width:300px;display:none;box-shadow:6px 0 18px rgba(0,0,0,.3)}
body.tablet .pane{position:absolute;top:0;bottom:22px;right:0;z-index:8;width:min(520px,88%);display:none;box-shadow:-6px 0 18px rgba(0,0,0,.3)}
body.tablet.drw-list .list,body.tablet.drw-pane .pane{display:flex}
.scr{position:absolute;top:0;bottom:22px;left:52px;right:0;z-index:7;background:rgba(0,0,0,.4)}

/* ================= phone stack shell (portrait) ================= */
body.phone{--safe:env(safe-area-inset-bottom,0px);font-size:15px;line-height:1.4;overflow:hidden}
body.phone.frame{--safe:22px}
.ms{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg)}
.sys{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 34px;background:var(--panel);color:var(--fg-hi);font-size:15px}
.sys .r{display:flex;align-items:center;gap:7px}
.sys .sig{width:17px;height:11px;background:currentColor;clip-path:polygon(0 100%,100% 0,100% 100%)}
.sys .bat{position:relative;width:25px;height:12px;border:1.5px solid currentColor;border-radius:3.5px}.sys .bat::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;border-radius:1.5px;background:currentColor}
.home{position:absolute;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg-hi);opacity:.5;z-index:9}
/* list page: large title */
.mh{flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.mtb{display:flex;align-items:center;height:44px;padding:0 4px}.mtb .sp{flex:1}
.mib{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--link);font-size:16px;flex:none}.mib svg.i{width:23px;height:23px}
.mtx{height:44px;padding:0 12px;color:var(--link);font-size:16px;flex:none}.mtx.b{font-weight:600}
.lt{font-size:30px;font-weight:700;line-height:1.15;color:var(--fg-hi);padding:0 16px 12px}
body.phone .search{height:38px;margin:0 16px 10px;padding:0 10px;gap:8px;border-radius:10px;font-size:15.5px}
body.phone .search svg.i{width:18px;height:18px}
body.phone .seg{margin:0 16px 10px;padding:2px;border-radius:9px}
body.phone .seg button{height:30px;padding:0;border-radius:7px;font-size:13.5px}body.phone .seg button.on{font-weight:600}
body.phone .chips{flex-wrap:nowrap;overflow-x:auto;margin:0;padding:0 16px 12px;gap:8px;scrollbar-width:none}
body.phone .chip{flex:none;font-size:13.5px;padding:5px 13px;border-radius:16px}
.mb{flex:1;min-height:0;overflow:auto;position:relative;background:var(--bg)}
body.phone .grp{position:sticky;top:0;z-index:1;background:var(--bg);padding:14px 16px 6px;font-size:12px}
body.phone .row{min-height:66px;padding:10px 16px;gap:4px 12px;border:0;border-bottom:1px solid var(--line);background:var(--bg)}
body.phone .row.on{background:var(--bg);color:inherit}
body.phone .row .t{font-size:16px;color:var(--fg-hi)}body.phone .row .m{font-size:13.5px}body.phone .row .a{font-size:12.5px;display:flex;align-items:center;gap:4px}
body.phone .row .d{width:10px;height:10px}body.phone .row.sub{padding-left:38px}
body.phone .row .t svg.i{width:19px;height:19px;margin-right:9px;vertical-align:-4px}
.fi svg.i{color:var(--link)!important}.fi.f svg.i{color:var(--dim)!important}
body.phone .hc{font-size:11.5px;padding:0 6px;border-radius:4px}
body.phone .lm{height:44px;width:calc(100% - 32px);margin:14px 16px;border-radius:10px;font-size:15px}
body.phone .nav{padding:0 16px 12px}
body.phone .nv{min-height:50px;padding:0 10px 0 14px;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15.5px;color:var(--fg-hi)}
body.phone .nv svg.i{width:20px;height:20px}body.phone .nv .c{font-size:12px;min-width:22px;line-height:20px;border-radius:10px;background:var(--accent);color:#fff}
.swp{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swp .row{transform:translateX(-222px);border-bottom:0!important}
.swp .sa{position:absolute;top:0;right:0;bottom:0;display:flex}
.swp .sa button{width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:12.5px}.swp .sa svg.i{width:21px;height:21px}
.sa .s1{background:var(--accent)}.sa .s2{background:#6e7681}.sa .s3{background:var(--err)}
/* bottom tab bar */
.mnav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 0 calc(4px + var(--safe))}
.mnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--soft);font-size:10.5px}
.mnav svg.i{width:25px;height:25px}.mnav button.on{color:var(--link)}
.mnav .badge{top:-3px;right:calc(50% - 24px)}.mnav .badge.dot{top:1px;right:calc(50% - 15px)}
/* detail page: nav bar */
.mn{flex:none;display:flex;align-items:center;min-height:54px;padding:0 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.mn .ttl{flex:1;min-width:0;padding:0 4px}
.mn .ttl b{display:block;font-size:16.5px;font-weight:600;color:var(--fg-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn .ttl small{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.bk{font-size:12.5px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;line-height:20px;font-weight:600}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}.sd.run{background:var(--ok)}
.mtabs{flex:none;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.mtabs button{position:relative;flex:1;height:42px;font-size:14.5px;color:var(--dim)}
.mtabs button.on{color:var(--fg-hi);font-weight:600}
.mtabs button.on::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:2.5px;border-radius:2px;background:var(--accent)}
.mtabs .k{display:inline-block;margin-left:4px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:17px;font-weight:600;vertical-align:1px}
/* shared editor bodies at phone size */
body.phone .log{padding:14px 0 18px}
body.phone .col{max-width:none;padding:0 16px}
body.phone .msg{font-size:15.5px;line-height:1.55;margin-bottom:18px}
body.phone .msg.me{width:fit-content;max-width:86%;margin-left:auto;background:var(--own-m);border:0;border-radius:18px 18px 4px 18px;padding:9px 14px}
body.phone .msg.me .ts{text-align:right}
body.phone .tool{border-radius:8px;padding:8px 12px;font-size:13px}
body.phone .chg{border-radius:10px;padding:11px 12px;font-size:13.5px}
body.phone .page{overflow:visible}
body.phone .pcol{max-width:none;padding:14px 16px 24px}
body.phone .psub{font-size:13.5px;margin-bottom:6px}
body.phone .card{border-radius:12px}
body.phone .ci{display:flex;flex-direction:column;align-items:stretch;padding:12px 14px}
body.phone .ci .l{font-size:15.5px}body.phone .ci .h{order:2;font-size:13px;margin-top:2px}
body.phone .ci>.btn,body.phone .ci>.acts{order:3;margin-top:10px}body.phone .ci>.btn{align-self:flex-start}
body.phone .ci>.pill{order:-1;align-self:flex-start;margin-bottom:5px}
body.phone ::-webkit-scrollbar{width:0;height:0}
body.phone .acts .btn{flex:1}
body.phone .btn{height:38px;padding:0 16px;border-radius:8px;font-size:14.5px}
body.phone .sh{font-size:12px;margin:22px 4px 8px}
body.phone .dv{overflow-x:auto}
/* phone widgets */
.mbtns{display:flex;gap:8px}
.mbtn{flex:1;height:44px;border-radius:10px;background:var(--btn2);color:var(--fg-hi);font-size:15px;font-weight:600}.mbtn.p{background:var(--accent);color:#fff}
.mc{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--safe))}
.mc .ctx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 2px 8px}
.mc .ctx>span{flex:none;display:flex;align-items:center;height:28px;padding:0 11px;margin:0;border-radius:14px;background:var(--btn2);color:var(--fg);font-size:12.5px;white-space:nowrap}
.mc .ctx>span.hc{background:var(--hc1-bg);color:var(--hc1)}.mc .ctx>span.hc.cx{background:var(--hc2-bg);color:var(--hc2)}
.mc .cm{display:inline-block;margin:0 2px 8px;padding:3px 10px;border:1px solid var(--toggle-line);border-radius:14px;background:var(--toggle);color:var(--fg-hi);font-size:12.5px}
.cin{display:flex;align-items:flex-end;gap:2px}
.cin .att{width:40px;height:40px;display:grid;place-items:center;color:var(--dim);flex:none}.cin .att svg.i{width:24px;height:24px}
.cin .in{flex:1;min-height:40px;margin:0 4px;padding:9px 14px;border:1px solid var(--field-line);border-radius:20px;background:var(--field);color:var(--ph);font-size:15.5px}
.cin .go{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}.cin .go svg.i{width:20px;height:20px;stroke-width:2.2}
.cin .go.stop{background:var(--fg-hi);color:var(--bg)}
.mro{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe));font-size:13px;color:var(--dim)}.mro .mbtn{width:100%;margin-top:10px}
.mgh{padding:20px 32px 7px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.mgf{padding:7px 32px 0;font-size:12.5px;color:var(--dim)}
.mg{margin:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.mb>.mg:first-child,.mdesc+.mg{margin-top:14px}
.mi{display:flex;align-items:center;gap:12px;min-height:50px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:15.5px;color:var(--fg-hi)}.mi:last-child{border-bottom:0}
.mi .mt{flex:1;min-width:0}.mi .mt small{display:block;margin-top:1px;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .v{color:var(--dim);font-size:15px;white-space:nowrap}
.mi>svg.i{width:20px;height:20px;color:var(--dim)}
.mi .cv{width:16px;height:16px;margin-left:-6px;color:var(--soft)}
.mi .ck{width:21px;height:21px;color:var(--link)}
.mi.off{opacity:.45}.mi.lnk,.mi.lnk>svg.i{color:var(--link)}
.mi .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--btn2);color:var(--fg-hi);flex:none}.mi .ic svg.i{width:18px;height:18px}
.mi .tagd{font-size:11.5px;padding:1px 7px;border:1px solid var(--field-line);border-radius:4px;color:var(--dim)}
.mi .mono{font:14px "Cascadia Code","JetBrains Mono",Consolas,monospace}
.mi .tb{color:var(--link);font-size:15px}
.tg{position:relative;flex:none;width:50px;height:30px;border-radius:15px;background:var(--btn2-hov)}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.tg.on{background:var(--accent)}.tg.on::after{left:23px}
.mdesc{padding:14px 32px 0;font-size:14px;color:var(--dim)}
.mnote{padding:0 16px 10px;font-size:13px;color:var(--dim)}
.mtop{padding-top:12px}
.mpath{padding:0 16px 10px;font:13px "Cascadia Code",Consolas,monospace;color:var(--dim);white-space:nowrap;overflow-x:auto}.mpath b{color:var(--fg-hi);font-weight:500}
.gs{display:inline-block;width:18px;font:700 13px "Cascadia Code",Consolas,monospace;color:var(--g-mod)}.gs.n{color:var(--g-new)}
.mdiff{font:12.5px/1.65 "Cascadia Code","JetBrains Mono",Consolas,monospace;padding:6px 0;overflow-x:auto}
.mdiff .dl{grid-template-columns:34px 1fr;padding-right:14px;width:max-content;min-width:100%}
.mfoot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px calc(0px + var(--safe));background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.mcode{font:13px/1.75 "Cascadia Code","JetBrains Mono",Consolas,monospace;padding:6px 0}
.mcode .dl{grid-template-columns:38px 1fr;white-space:pre-wrap;padding-right:14px}.mcode .dl.cur{background:var(--hover)}
.caret{display:inline-block;width:2px;height:17px;background:var(--accent);vertical-align:-4px}
.term{min-height:100%;padding:10px 12px;background:var(--bg);font:12.5px/1.55 "Cascadia Code","JetBrains Mono",Consolas,monospace;color:var(--fg);white-space:pre-wrap}
.term .p{color:var(--g-new)}.term .cu{display:inline-block;width:8px;height:15px;background:var(--fg);vertical-align:-3px}
.keys{flex:none;display:flex;gap:6px;padding:8px 8px calc(8px + var(--safe));overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
.keys span{flex:none;min-width:44px;height:38px;padding:0 10px;border-radius:8px;background:var(--btn2);display:grid;place-items:center;font:13.5px "Cascadia Code",Consolas,monospace;color:var(--fg-hi)}.keys span.on{background:var(--accent);color:#fff}
/* bottom sheets */
.scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:80%;display:flex;flex-direction:column;padding:6px 0 calc(10px + var(--safe));background:var(--widget);border-top:1px solid var(--line);border-radius:14px 14px 0 0}
.sheet .grab{flex:none;width:38px;height:5px;margin:2px auto 10px;border-radius:3px;background:var(--field-line)}
.sheet .st{flex:none;padding:0 20px 12px;border-bottom:1px solid var(--line)}.sheet .st b{display:block;font-size:16px;color:var(--fg-hi)}.sheet .st small{font-size:12.5px;color:var(--dim)}
.sheet .sbd{flex:1;min-height:0;overflow:auto}
.sheet .op{display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;border-bottom:1px solid var(--line);font-size:16px;color:var(--fg-hi)}.sheet .op:last-child{border-bottom:0}
.sheet .op>svg.i{width:21px;height:21px;color:var(--dim)}.sheet .op.dg,.sheet .op.dg>svg.i{color:var(--err)}
.sheet .op small{margin-left:auto;font-size:13px;color:var(--dim)}.sheet .op .ck{width:21px;height:21px;color:var(--link)}
.sheet .op.on{color:var(--link)}
.sheet .cancel{flex:none;height:50px;margin:10px 12px 0;border-radius:12px;background:var(--btn2);color:var(--fg-hi);font-size:16px;font-weight:600}
.sheet .search{margin:12px 16px 6px}
.sheet .q{margin:12px 16px 0;padding:8px 10px;border-radius:8px;background:var(--bg);font:12px/1.55 "Cascadia Code",Consolas,monospace;color:var(--dim);white-space:pre;overflow:hidden}
.sheet .ta{margin:10px 16px 0;min-height:84px;padding:10px 12px;border:1px solid var(--focus);border-radius:10px;background:var(--field);font-size:15px;color:var(--fg-hi)}
.sheet .mbtns{padding:12px 16px 0}
/* phone forms, alert, login */
.mi.ta{align-items:flex-start;min-height:92px;font:14px/1.6 "Cascadia Code","JetBrains Mono",Consolas,monospace;color:var(--fg-hi)}
.mi .seg{margin:0}.mi .iv{color:var(--fg-hi);font-size:15.5px}
.mi .tagx{padding:3px 6px 3px 11px;border-radius:13px;font-size:13px}
.alert{position:absolute;top:50%;left:50%;z-index:6;width:280px;margin:-100px 0 0 -140px;overflow:hidden;background:var(--widget);border-radius:14px;text-align:center}
.alert b{display:block;padding:20px 16px 6px;font-size:16.5px;color:var(--fg-hi)}.alert p{margin:0;padding:0 18px 18px;font-size:13.5px;color:var(--dim)}

  const rail=[['topics','chat','话题','<span class="badge">2</span>'],['history','history','历史',''],['tasks','clock','定时','<span class="badge dot"></span>'],['reviews','eye','复盘',''],['skills','book','技能','']];
  const tabs=`<div class="tabs">${p.open.map(k=>{const [ic,t,mk]=ED[k].tab;return `<div class="tab${k===p.ed?' on':''}">${I(ic)}<span>${t}</span>${mk?`<i class="mk ${mk}"></i>`:''}<button class="x" title="关闭">${I('cross')}</button></div>`}).join('')}</div>`;
  document.body.innerHTML=`<div class="shell">
<nav class="rail"><div class="logo">f</div>${rail.map(([k,ic,l,b])=>`<button class="ri${k===rk?' on':''}">${I(ic)}<span>${l}</span>${b}</button>`).join('')}<div class="sp"></div><button class="ri${rk==='settings'?' on':''}">${I('gear')}<span>设置</span></button></nav>
<aside class="list"><div class="lh"><b>${v.title}</b>${(v.acts||[]).map(([ic,t])=>`<button class="ib" title="${t}">${I(ic)}</button>`).join('')}</div>${v.top||''}<div class="rows">${v.body}</div></aside>
<section class="main">${tabs}<div class="th">${typeof e.head==='function'?e.head(p):e.head}</div>${e.body()}${e.foot?e.foot():''}${p.bottom?termPanel():''}</section>
${p.pane?`<aside class="pane"><div class="grip"></div>${p.pane==='files'?filesPane:changesPane}</aside>`:''}
<footer class="sb"><span class="it rm">${I('remote')}fleetherd</span><span class="it">${I('check')}已连接</span><span class="it"><span class="okc">${I('play')}</span>运行中 3</span><span class="it">${I('pause')}空闲 7</span><span class="sp"></span><span class="it">${I('bell')}通知 开</span><span class="it">${I('moon')}低打扰 关</span><span class="it">${I('globe')}中文</span><span class="it">v3.38.0</span></footer></div>`;
  if(TABLET){const d=Q.get('drawer');document.body.className='tablet'+(d==='list'?' drw-list':d==='pane'?' drw-pane':'');if(d)document.querySelector('.shell').insertAdjacentHTML('beforeend','<div class="scr"></div>');}
  else if(p.pane&&innerWidth<1360){document.querySelector('.shell').style.gridTemplateColumns='52px minmax(0,1fr) auto';document.querySelector('.list').style.display='none';document.body.classList.add('narrow');}
  if(p.ov)document.body.insertAdjacentHTML('beforeend',OV[p.ov]);
  if(p.anchor)document.getElementById(p.anchor).scrollIntoView();
}

/* ===== shell 2: phone stack ===== */
const MR={
  topics:{list:'topics',nav:0,s:{swipe:1}}, 'sheet-row':{list:'topics',nav:0,sheet:'row'},
  history:{list:'history',nav:1}, tasks:{list:'tasks',nav:2}, more:{list:'more',nav:3},
  reviews:{list:'reviews',nav:3,back:'更多'}, skills:{list:'skills',nav:3,back:'更多'}, settings:{list:'settings',nav:3,back:'更多'},
  topic:{ed:'chat',tab:0}, 'sheet-model':{ed:'chat',tab:0,sheet:'model'},
  'topic-changes':{ed:'chat',tab:1,body:pChanges,foot:''}, 'topic-files':{ed:'chat',tab:2,body:pFiles,foot:''}, 'topic-term':{ed:'chat',tab:3,body:pTerm,foot:keys},
  'topic-diff':{ed:'diff',sheet:'cmt'}, 'topic-file':{ed:'file'},
  confirm:{list:'topics',nav:0,sheet:'alert'}, sessions:{list:'sessions',nav:2}, 'task-edit':{ed:'taskEdit'}, appearance:{ed:'appearance'},
  'settings-delegation':{ed:'setDlg'}, 'settings-session':{ed:'setSession'}, 'settings-reply':{ed:'setReply'}, 'settings-review':{ed:'setReview'}, 'settings-instr':{ed:'instr'},
  new:{ed:'new'}, task:{ed:'task'}, 'history-rec':{ed:'hist'}, review:{ed:'review'}, prefs:{ed:'prefs'}, skill:{ed:'skill'}, 'settings-agents':{ed:'agents'},
};
function phone(){
  const r=MR[view]||MR.topics, frame=Q.has('frame'); let h='';
  if(frame)h+='<div class="sys"><b>9:41</b><span class="r"><i class="sig"></i><i class="bat"></i></span></div>';
  if(view==='login')h+=loginHtml;
  else if(r.list){
    const v=SIDE[r.list](r.s||{});
    h+=`<header class="mh"><div class="mtb">${r.back?`<button class="mib">${I('left')}<span>${r.back}</span></button>`:''}<span class="sp"></span>${(v.acts||[]).map(([ic,t])=>`<button class="mib" title="${t}">${I(ic)}</button>`).join('')}</div><div class="lt">${v.title}</div>${v.top||''}</header><main class="mb">${v.body}</main>`;
    h+=`<nav class="mnav">${[['chat','话题','<span class="badge">2</span>'],['history','历史',''],['clock','定时','<span class="badge dot"></span>'],['more','更多','']].map(([ic,l,b],i)=>`<button class="${i===r.nav?'on':''}">${I(ic)}<span>${l}</span>${b}</button>`).join('')}</nav>`;
  }else{
    const e=ED[r.ed], m=e.m;
    h+=`<header class="mn">${m.left??`<button class="mib">${I('left')}${m.bk?`<span class="bk">${m.bk}</span>`:''}</button>`}<div class="ttl"><b>${m.t}</b>${m.s?`<small>${m.s}</small>`:''}</div>${m.right??(m.acts||[]).map(ic=>`<button class="mib">${I(ic)}</button>`).join('')}</header>`;
    if(r.tab!==undefined)h+=`<nav class="mtabs">${['对话','更改<span class="k">2</span>','文件','终端'].map((x,i)=>`<button class="${i===r.tab?'on':''}">${x}</button>`).join('')}</nav>`;
    const foot=r.foot!==undefined?r.foot:(e.foot?e.foot():'');
    h+=`<main class="mb"${foot?'':' style="padding-bottom:var(--safe)"'}>${(r.body||e.body)()}</main>${foot}`;
  }
  if(r.sheet)h+=`<div class="scrim"></div>${SHEETS[r.sheet]()}`;
  if(frame)h+='<div class="home"></div>';
  document.body.className='phone'+(frame?' frame':'');
  document.body.innerHTML=`<div class="ms">${h}</div>`;
}

  ['话题工具',[['topic-changes','更改'],['topic-diff','diff · 长按行号选几行 → 评论'],['topic-files','文件 · 逐层进入'],['topic-file','编辑文件'],['topic-term','终端 · 常用键一排']]],
  ['定时与历史',[['tasks','定时'],['task','任务详情'],['history','历史'],['history-rec','历史记录 · 只读']]],
  ['更多 · 复盘',[['more','更多 · 设备开关和网关状态'],['reviews','复盘'],['review','复盘详情'],['prefs','偏好建议']]],
  ['更多 · 技能与设置',[['skills','技能'],['skill','技能页'],['settings','设置'],['settings-agents','设置 · 智能体']]],

  ['表单与其他',[['appearance','外观与语言'],['task-edit','编辑定时任务'],['sessions','定时 · 会话'],['confirm','删除确认'],['login','登录']]],
];
function gallery(){
  const n=Q.get('gallery'), lt=Q.has('light')?'&light':'';
  document.body.className='gal';
  if(n==='t'){document.body.innerHTML=`<div class="gl"><h2>640–1023px · 820 宽竖屏</h2><div class="frames">${[['','侧栏收起，编辑区只有一组'],['&drawer=list','点导航条 → 列表抽屉'],['&drawer=pane','点「更改」→ 右侧抽屉']].map(([q,c])=>`<figure class="tb"><iframe src="?t${q}${lt}#topic"></iframe><figcaption>${c}</figcaption></figure>`).join('')}</div></div>`;return;}
  document.body.innerHTML=`<div class="gl">${(n?[GAL[+n-1]]:GAL).map(([h,fs])=>`<h2>${h}</h2><div class="frames">${fs.map(([k,c])=>`<figure><iframe src="?m&frame${lt}#${k}"></iframe><figcaption>${c}</figcaption></figure>`).join('')}</div>`).join('')}</div>`;

if(Q.has('gallery'))gallery();else if(PHONE)phone();else desktop();
